name: Release
on:
  push: { tags: ['v*'] }
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build installers
        run: scripts/package.sh
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" dist/Offerlane-*.dmg dist/Offerlane-*.pkg dist/SHA256SUMS.txt --title "Offerlane $GITHUB_REF_NAME" --generate-notes
