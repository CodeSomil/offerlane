name: Release
# Run manually (Actions → Release → Run workflow) with a tag like v0.2.0 to build and publish installers from CI.
on:
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag, e.g. v0.2.0', required: true }
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Build installers
        run: scripts/package.sh
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "${{ inputs.tag }}" dist/Offerlane-*.dmg dist/Offerlane-*.pkg dist/SHA256SUMS.txt --title "Offerlane ${{ inputs.tag }}" --generate-notes
