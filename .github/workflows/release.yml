# Creates a DRAFT GitHub release when a version tag (v0.2.0, …) is pushed, with the notes from docs/RELEASE_NOTES.md.
# The signed, notarised Offerlane-<version>.dmg / .pkg / SHA256SUMS.txt are built on the maintainer's Mac
# (scripts are not public) and attached by hand before publishing the draft. Nothing is built here.
name: Draft release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release $TAG already exists"; exit 0; }
          gh release create "$TAG" --draft --title "Offerlane ${TAG#v}" --notes-file docs/RELEASE_NOTES.md
          echo "Draft created. Attach Offerlane-${TAG#v}.dmg, .pkg and SHA256SUMS.txt, then publish."
