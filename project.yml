name: Offerlane
options:
  bundleIdPrefix: com.somilmanke
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      ONLY_ACTIVE_ARCH: NO
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  OfferlaneCore:
    path: Packages/OfferlaneCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
targets:
  Offerlane:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["SelfTest/**"]
      - path: App/Resources/SelfTest
        type: folder
        buildPhase: resources
    dependencies:
      - package: OfferlaneCore
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Offerlane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Offerlane
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Somil Manke"
        SUFeedURL: "https://example.invalid/offerlane/appcast.xml"
        SUEnableAutomaticChecks: false
    postBuildScripts:
      - name: Bundle tectonic
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # LaTeX engine (scripts/fetch-tectonic.sh) in Contents/Helpers, pre-warmed package cache in Resources.
          if [ -x "$SRCROOT/Vendor/tectonic/bin/tectonic" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
            rsync -a "$SRCROOT/Vendor/tectonic/bin/tectonic" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/"
            # Nested executables must be signed before the app (lipo dropped the upstream signatures).
            codesign --force --options runtime --timestamp=none --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/tectonic"
          else
            echo "warning: Vendor/tectonic missing; run scripts/fetch-tectonic.sh (LaTeX resumes will fall back to the standard template)"
          fi
          if [ -d "$SRCROOT/Vendor/tectonic/cache" ]; then
            rsync -a --delete "$SRCROOT/Vendor/tectonic/cache/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TectonicCache/"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.somilmanke.Offerlane
        PRODUCT_NAME: Offerlane
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OfferlaneUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: Offerlane
    settings:
      base:
        TEST_TARGET_NAME: Offerlane
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.somilmanke.OfferlaneUITests
schemes:
  Offerlane:
    build:
      targets:
        Offerlane: all
    test:
      targets: [OfferlaneUITests]
