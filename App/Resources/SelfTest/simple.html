<!doctype html><meta charset=utf-8><title>Globex – Apply</title>
<form onsubmit="document.body.innerHTML='<h2>Thank you for applying!</h2>';return false">
<h2>Apply: Data Scientist</h2>
<label for=fn>First Name *</label><input id=fn required><br><label for=ln>Last Name *</label><input id=ln required><br>
<label for=em>Email *</label><input id=em type=email required><br><label for=ph>Phone *</label><input id=ph required><br>
<label for=cv>Resume/CV *</label><input id=cv type=file required><br>
<label for=li>LinkedIn Profile</label><input id=li><br>
<label for=sp>Will you now or in the future require visa sponsorship? *</label><select id=sp required><option>Select...</option><option>Yes</option><option>No</option></select><br>
<label for=cl>Cover letter</label><textarea id=cl></textarea><br>
<label for=why>Why are you interested in Globex? *</label><textarea id=why required></textarea><br>
<input type=checkbox id=pp required><label for=pp>I agree to the privacy policy *</label><br>
<button type=submit>Submit application</button></form>
